<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#13171F">

    <title>Custom PHP, JavaScript and WordPress Development Services - sensmai</title>
    <meta name="description" content="PHP, JavaScript, and WordPress development services">
    <link rel="canonical" href="https://sensmai.github.io/">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Custom PHP, JavaScript and WordPress Development Services">
    <meta property="og:description"
          content="We build websites, plugins, and applications in PHP, JavaScript, and WordPress.">
    <meta property="og:url" content="https://sensmai.github.io/">
    <meta property="og:site_name" content="sensmai.github.io">
    <meta property="og:image" content="https://sensmai.github.io/assets/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">

    <link rel="icon" href="/assets/images/favicon.png" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">

    <link rel="stylesheet" href="/assets/css/cyan.css">
    <script type="module" src="/assets/js/index.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <script>
        let formSubmitted = false;

        function enableSubmit() {
            document.getElementById('submit-button').disabled = false;
        }
    </script>
</head>
<body>
<header>
    <div class="brand container-fluid">
        <img src="/assets/images/logo.png" class="logo hide-sm" alt="sensmai logo">
        <img src="/assets/images/logo-sm.png" class="logo hide-md" alt="sensmai logo">
        <hgroup>
            <h1>sensmai</h1>
            <span>@github.io</span>
        </hgroup>
    </div>
</header>
<main class="container-fluid" data-pxp-app>

    <form enctype="text/plain"
          action="https://docs.google.com/forms/d/e/1FAIpQLSfBY4JbRD-HIo2L779LJgNoOML4ofBFv-SL3hd1pRtVWwCC4Q/formResponse?"
          target="hidden_iframe"
          onsubmit="formSubmitted=true;"
          data-pxp="form">

        <label for="entry.2005620554">name[*]</label>
        <input type="text" id="entry.2005620554" name="entry.2005620554" required>

        <label for="entry.1045781291">email[*]</label>
        <input type="email" id="entry.1045781291" name="entry.1045781291" required>

        <label for="entry.839337160">message[*]</label>
        <textarea id="entry.839337160" name="entry.839337160" required></textarea>

        <button id="submit-button"
                type="submit"
                disabled>
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke-width="1.5"
                 stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
            </svg>
        </button>

        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAACvUMjUVJGRGh-7D"
             data-theme="dark"
             data-size="compact"
             data-callback="enableSubmit"></div>
    </form>

    <progress></progress>

    <div class="pxp-notice pxp-success" data-pxp-status="success">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke-width="1.5"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <span>Message sent successfully</span>
    </div>

    <iframe name="hidden_iframe"
            id="hidden_iframe"
            style="display:none;"
            onload="if(formSubmitted) {}"></iframe>
</main>
<footer class="container-fluid">
    <section class="secondary">
        <p class="text-xs mb-1">&copy; 2026 sensmai</p>
        <p class="text-xxs mb-0">PHP, JavaScript, and WordPress <br/> development services</p>
    </section>
</footer>
</body>
</html>
